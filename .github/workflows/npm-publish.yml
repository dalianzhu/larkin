name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish to npm (for example, v0.2.69)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      # An older release tag pins an older Bun, and its own scripts check that version strictly.
      - name: Read the release's pinned Bun version
        id: release-bun
        run: |
          version="$(jq -er '.packageManager | select(type == "string" and test("^bun@[0-9]+\\.[0-9]+\\.[0-9]+\\z")) | sub("^bun@"; "")' package.json)" || {
            echo "Refusing to publish: package.json does not pin packageManager bun@X.Y.Z" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up the release's pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.release-bun.outputs.version }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify package version matches release tag
        run: bun run release:check-version "${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}"

      - name: Generate third-party notices
        run: bun run licenses:generate

      - name: Publish to npm registry
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NPM_TOKEN" || { echo "NPM_TOKEN secret is not configured" >&2; exit 1; }
          npm config set registry https://registry.npmjs.org/
          npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
          npm publish
